name: mk-watch

on:
  schedule:
    - cron: "*/15 * * * *"
    workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Test: also report significant items from the last N hours (0 = normal run)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: mk-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start RSS-Bridge (for Facebook, Instagram, X)
        run: |
          docker run -d --name rssbridge -p 3000:80 \
            -v "$PWD/rss-bridge/config.ini.php:/app/config.ini.php:ro" \
            rssbridge/rss-bridge:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 2
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor.py --backfill-hours "${{ inputs.backfill_hours || 0 }}"

      - name: Save state
        if: always()
        run: |
          git config user.name "mk-watch bot"
          git config user.email "mk-watch@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push || (git pull --rebase && git push)
